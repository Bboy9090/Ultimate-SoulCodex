# Reproducible build and test workflow for the SoulCodex workspace.
# Aligned with Bobby's Workshop CI standards.

name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build:workspaces

      - name: Check workspace packages
        run: npm run check:workspaces

      - name: Run workspace tests
        run: npm test

      - name: Run astrology trust tests
        run: node --import tsx --test tests/astrology-candidate.test.ts tests/astrology-independent-verification.test.ts tests/jpl-horizons-reference.test.ts tests/astrology-evidence-matrix.test.ts

      - name: Build project
        run: npm run build
