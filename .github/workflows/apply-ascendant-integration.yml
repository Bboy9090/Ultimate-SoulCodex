name: Apply Ascendant Production Integration

on:
  push:
    branches:
      - feat/astrology-ascendant-verification-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/astrology-ascendant-verification-v1
          fetch-depth: 0

      - name: Patch governed production path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/services/astrology.ts')
          text = path.read_text()

          anchor = '''import {
            APPROVED_LONGITUDE_TOLERANCE_EVIDENCE,
            getApprovedLongitudeTolerancePolicy,
          } from "./astrology-tolerance-policy";
          '''
          replacement = anchor + '''import {
            APPROVED_ASCENDANT_POLICY,
            calculateAscendantCandidate,
            verifyAscendant,
            type AscendantVerificationPolicy,
          } from "./ascendant-verification";
          '''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          text = text.replace(
            '    verifiedBodies: VerifiableBody[];',
            '    verifiedBodies: Array<VerifiableBody | "Ascendant">;',
            1,
          )

          options_anchor = '''export interface VerifiedAstrologyOptions {
            referenceFetcher?: IndependentReferenceFetcher;
            policyForBody?: (body: VerifiableBody) => VerificationPolicy;
          }
          '''
          options_replacement = '''export interface VerifiedAstrologyOptions {
            referenceFetcher?: IndependentReferenceFetcher;
            policyForBody?: (body: VerifiableBody) => VerificationPolicy;
            ascendantPolicy?: AscendantVerificationPolicy;
          }
          '''
          assert options_anchor in text
          text = text.replace(options_anchor, options_replacement, 1)

          old_rising = '''function getRisingPlacement(birthData: BirthData): PlacementVerification {
            if (!birthData.birthTime || !birthData.timezone) {
              return {
                sign: null,
                status: "requires_verified_birth_time",
                confidence: null,
                source: null,
                reason: "Verified birth time and timezone required for Rising sign calculation",
              };
            }

            if (birthData.latitude === undefined || birthData.longitude === undefined) {
              return {
                sign: null,
                status: "requires_location",
                confidence: null,
                source: null,
                reason: "Precise birth coordinates required for Rising sign calculation",
              };
            }

            return {
              sign: null,
              status: "pending_ephemeris",
              confidence: null,
              source: null,
              reason:
                "Ascendant calculation remains intentionally blocked until its formula and independent reference suite are validated",
            };
          }
          '''
          new_rising = '''function getRisingPlacement(birthData: BirthData): PlacementVerification {
            if (!birthData.birthTime || !birthData.timezone) {
              return {
                sign: null,
                status: "requires_verified_birth_time",
                confidence: null,
                source: null,
                reason: "Verified birth time and timezone required for Rising sign calculation",
              };
            }

            if (birthData.latitude === undefined || birthData.longitude === undefined) {
              return {
                sign: null,
                status: "requires_location",
                confidence: null,
                source: null,
                reason: "Precise birth coordinates required for Rising sign calculation",
              };
            }

            const timestamp = buildUtcBirthTimestamp(birthData, true);
            if (!timestamp) {
              return {
                sign: null,
                status: "pending_ephemeris",
                confidence: null,
                source: null,
                reason: "Birth date, time, or timezone could not be converted safely",
              };
            }

            try {
              const candidate = calculateAscendantCandidate({
                inputTimestamp: timestamp.toISOString(),
                latitude: birthData.latitude,
                longitude: birthData.longitude,
              });
              return pendingCandidatePlacement({
                sign: candidate.sign,
                longitude: candidate.longitudeDegrees,
                source: candidate.source,
                engine: candidate.engine,
                calculatedAt: candidate.calculatedAt,
                inputTimestamp: candidate.inputTimestamp,
              });
            } catch {
              return {
                sign: null,
                status: "pending_ephemeris",
                confidence: null,
                source: null,
                reason: "Ascendant calculation failed safely; no placement was promoted",
              };
            }
          }

          function verifyRisingPlacement(
            placement: PlacementVerification,
            birthData: BirthData,
            policy: AscendantVerificationPolicy,
          ): PlacementVerification {
            if (
              !placement.candidate ||
              birthData.latitude === undefined ||
              birthData.longitude === undefined
            ) {
              return placement;
            }

            const result = verifyAscendant(
              {
                inputTimestamp: placement.candidate.inputTimestamp,
                latitude: birthData.latitude,
                longitude: birthData.longitude,
              },
              policy,
            );

            if (result.status !== "verified") {
              return {
                ...placement,
                reason: `Independent Ascendant verification rejected the candidate: ${result.reason}`,
                verificationFailure: {
                  reason: result.reason,
                  attemptedAt: new Date().toISOString(),
                },
              };
            }

            const source = `${result.candidate.source}; independently confirmed by ${result.reference.source}`;
            const engine = `${result.candidate.engine} + ${result.reference.engine}`;
            return {
              sign: result.sign,
              status: "verified",
              confidence: 1,
              source,
              candidate: placement.candidate,
              provenance: {
                source,
                engine,
                calculatedAt: result.verifiedAt,
                inputTimestamp: result.candidate.inputTimestamp,
                candidateSource: result.candidate.source,
                candidateEngine: result.candidate.engine,
                candidateCalculatedAt: result.candidate.calculatedAt,
                referenceSource: result.reference.source,
                referenceEngine: result.reference.engine,
                referenceCalculatedAt: result.reference.calculatedAt,
                policyId: result.policy.policyId,
                evidenceReceiptId:
                  result.policy.evidenceReceiptId ?? "ASCENDANT-VERIFICATION-RECEIPT-v1",
                evidenceArtifactId: "swiss-ephemeris-2.10.03-24-fixture-matrix",
                longitudeDeltaDegrees: result.longitudeDeltaDegrees,
              },
              reason:
                "Ascendant longitude and sign agreed across independent engines within the approved tolerance",
            };
          }
          '''
          assert old_rising in text
          text = text.replace(old_rising, new_rising, 1)

          text = text.replace(
            '  const verifiedBodies: VerifiableBody[] = [];\n  if (sun.status === "verified") verifiedBodies.push("Sun");\n  if (moon.status === "verified") verifiedBodies.push("Moon");',
            '  const verifiedBodies: Array<VerifiableBody | "Ascendant"> = [];\n  if (sun.status === "verified") verifiedBodies.push("Sun");\n  if (moon.status === "verified") verifiedBodies.push("Moon");\n  if (rising.status === "verified") verifiedBodies.push("Ascendant");',
            1,
          )

          text = text.replace(
            '  if (rising.status !== "verified") missingData.push("validated_ascendant_engine");',
            '  if (rising.status !== "verified") missingData.push("independent_ascendant_verification");',
            1,
          )

          old_summary = '''    policyId:
              verifiedBodies.length > 0 ? "ASTRO-LONGITUDE-v1" : null,
            evidenceReceiptId:
              verifiedBodies.length > 0
                ? APPROVED_LONGITUDE_TOLERANCE_EVIDENCE.receiptRunId
                : null,
          '''
          new_summary = '''    policyId:
              verifiedBodies.length === 0
                ? null
                : verifiedBodies.includes("Ascendant")
                  ? "ASTRO-LONGITUDE-v1 + ASTRO-ASCENDANT-v1"
                  : "ASTRO-LONGITUDE-v1",
            evidenceReceiptId:
              verifiedBodies.length === 0
                ? null
                : verifiedBodies.includes("Ascendant")
                  ? `${APPROVED_LONGITUDE_TOLERANCE_EVIDENCE.receiptRunId} + ASCENDANT-VERIFICATION-RECEIPT-v1`
                  : APPROVED_LONGITUDE_TOLERANCE_EVIDENCE.receiptRunId,
          '''
          assert old_summary in text
          text = text.replace(old_summary, new_summary, 1)

          text = text.replace(
            '  const options: Required<VerifiedAstrologyOptions> = {',
            '  const options: Required<Pick<VerifiedAstrologyOptions, "referenceFetcher" | "policyForBody">> = {',
            1,
          )

          old_verify = '''  const [sun, moon] = await Promise.all([
            verifyPlacement("Sun", candidateData.sun, options),
            verifyPlacement("Moon", candidateData.moon, options),
          ]);
          const rising = candidateData.rising;
          '''
          new_verify = '''  const [sun, moon] = await Promise.all([
            verifyPlacement("Sun", candidateData.sun, options),
            verifyPlacement("Moon", candidateData.moon, options),
          ]);
          const rising = verifyRisingPlacement(
            candidateData.rising,
            birthData,
            suppliedOptions.ascendantPolicy ?? APPROVED_ASCENDANT_POLICY,
          );
          '''
          assert old_verify in text
          text = text.replace(old_verify, new_verify, 1)
          path.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text()
          test_anchor = '          tests/human-design-trust.test.ts\n'
          assert test_anchor in ci_text
          ci_text = ci_text.replace(
            test_anchor,
            test_anchor + '          tests/ascendant-verification.test.ts\n',
            1,
          )
          ci.write_text(ci_text)

          test_path = Path('tests/astrology-production-verification.test.ts')
          test_text = test_path.read_text()
          import_anchor = '''import {
            APPROVED_LONGITUDE_TOLERANCE_EVIDENCE,
            getApprovedLongitudeTolerancePolicy,
          } from "../server/services/astrology-tolerance-policy";
          '''
          assert import_anchor in test_text
          test_text = test_text.replace(
            import_anchor,
            import_anchor + 'import { APPROVED_ASCENDANT_POLICY } from "../server/services/ascendant-verification";\n',
            1,
          )
          test_text = test_text.replace(
            'test("matching independent references promote Sun and Moon with complete provenance", async () => {',
            'test("matching independent references promote Sun, Moon, and Ascendant with complete provenance", async () => {',
            1,
          )
          old_expectations = '''  assert.deepEqual(result.verification.verifiedBodies, ["Sun", "Moon"]);
            assert.deepEqual(result.verification.unresolvedBodies, ["Ascendant"]);
            assert.equal(result.rising.status, "pending_ephemeris");
            assert.equal(result.rising.sign, null);
          });
          '''
          new_expectations = '''  assert.deepEqual(result.verification.verifiedBodies, ["Sun", "Moon", "Ascendant"]);
            assert.deepEqual(result.verification.unresolvedBodies, []);
            assert.equal(result.rising.status, "verified");
            assert.equal(result.rising.sign, "Scorpio");
            assert.ok(result.rising.provenance);
            assert.equal(result.rising.provenance.policyId, "ASTRO-ASCENDANT-v1");
            assert.equal(
              result.rising.provenance.evidenceReceiptId,
              "ASCENDANT-VERIFICATION-RECEIPT-v1",
            );
          });
          '''
          assert old_expectations in test_text
          test_text = test_text.replace(old_expectations, new_expectations, 1)

          insertion = '''
          test("a draft Ascendant policy cannot promote the Rising candidate", async () => {
            const result = await calculateVerifiedAstrology(birthData, {
              referenceFetcher: matchingReferenceFetcher(),
              ascendantPolicy: {
                ...APPROVED_ASCENDANT_POLICY,
                status: "draft",
                approvedAt: undefined,
              },
            });

            assert.equal(result.sun.status, "verified");
            assert.equal(result.moon.status, "verified");
            assert.equal(result.rising.status, "calculated_pending_independent_verification");
            assert.equal(result.rising.sign, null);
            assert.equal(result.rising.verificationFailure?.reason, "policy_not_approved");
          });

          '''
          marker = 'test("missing birth time prevents network verification and leaves timed placements unresolved", async () => {'
          assert marker in test_text
          test_text = test_text.replace(marker, insertion + marker, 1)
          test_path.write_text(test_text)
          PY

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/services/astrology.ts tests/astrology-production-verification.test.ts .github/workflows/ci.yml
          git commit -m 'feat(astrology): verify and expose Ascendant placements'
          git push origin HEAD:feat/astrology-ascendant-verification-v1
