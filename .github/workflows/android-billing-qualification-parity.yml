name: Android Play Billing Qualification Artifact

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "client/**"
      - "server/**"
      - "scripts/**"
      - "tests/native-billing-bridge-contract.test.ts"
      - "tests/native-billing-server-verification-contract.test.ts"
      - "tests/android-billing-qualification-build-contract.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-billing-qualification-parity.yml"

permissions:
  contents: read

concurrency:
  group: android-play-billing-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_API_URL: https://soulcodex.up.railway.app
  VITE_RELEASE_VERSION: 4.1.0
  VITE_API_CONTRACT: foundation-v4
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  VITE_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  VITE_BILLING_QUALIFICATION_MODE: "true"
  QUALIFICATION_VERSION_CODE: "4000017"

jobs:
  android-play-billing-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Prove exact source candidate
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run check

      - name: Run native billing qualification contracts
        run: |
          node --import tsx --test \
            tests/native-billing-bridge-contract.test.ts \
            tests/native-billing-server-verification-contract.test.ts \
            tests/native-billing-lifecycle-behavior.test.ts \
            tests/billing-production-readiness-contract.test.ts \
            tests/billing-variable-name-audit.test.ts \
            tests/ios-billing-qualification-build-contract.test.ts \
            tests/android-billing-qualification-build-contract.test.ts

      - name: Validate normal Android release metadata before qualification override
        run: npm run mobile:validate:android

      - name: Build qualification-marked Capacitor payload
        run: |
          test "$VITE_BILLING_QUALIFICATION_MODE" = "true"
          npm run build:capacitor
          npx cap sync android

      - name: Set a unique Alpha qualification version code
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALIFICATION_VERSION_CODE" = "4000017"
          test "$(grep -Ec 'versionCode 4000016' android/app/build.gradle)" -eq 1
          sed -i 's/versionCode 4000016/versionCode 4000017/' android/app/build.gradle
          grep -F 'versionCode 4000017' android/app/build.gradle
          test "$(git diff --numstat -- android/app/build.gradle | awk '{print $1 ":" $2}')" = "1:1"

      - name: Require release signing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Materialize temporary upload keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > android/app/soulcodex-release.keystore
          test -s android/app/soulcodex-release.keystore
          keytool -list -keystore android/app/soulcodex-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed Alpha qualification AAB
        working-directory: android
        run: |
          ./gradlew --no-daemon bundleRelease \
            -PRELEASE_STORE_FILE=soulcodex-release.keystore \
            -PRELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Verify signed qualification artifact
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"
          sha256sum "$AAB" > AAB-SHA256.txt
          keytool -printcert -jarfile "$AAB" | grep -E 'SHA1:|SHA256:' > SIGNING-CERT-FINGERPRINTS.txt
          {
            echo "source_sha=$CANDIDATE_SHA"
            echo "version_name=4.1.0"
            echo "version_code=$QUALIFICATION_VERSION_CODE"
            echo "package_name=soulcodex.app"
            echo "billing_qualification_mode=true"
            echo "distribution=Google Play Alpha/internal/closed test only"
            echo "production_billing_enabled=false"
            echo "production_publish_attempted=false"
            echo "play_upload_attempted=false"
            echo "artifact_sha256=$(cut -d ' ' -f1 AAB-SHA256.txt)"
          } > android-play-billing-qualification-receipt.txt

      - name: Upload Alpha qualification artifact and receipt
        uses: actions/upload-artifact@v6
        with:
          name: soulcodex-4.1.0-android-play-qualification
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            AAB-SHA256.txt
            SIGNING-CERT-FINGERPRINTS.txt
            android-play-billing-qualification-receipt.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary upload keystore
        if: always()
        run: rm -f android/app/soulcodex-release.keystore
