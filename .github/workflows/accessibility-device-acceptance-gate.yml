name: Accessibility Device Acceptance Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-device-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspaces
        run: npm run build:workspaces

      - name: Accessibility and device acceptance contracts
        run: node --import tsx --test tests/accessibility-device-acceptance-contract.test.ts

      - name: Reject high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Validate iOS release configuration
        env:
          VITE_API_URL: https://soulcodex.up.railway.app
          VITE_RELEASE_VERSION: 4.1.0
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_API_CONTRACT: foundation-v4
        run: npm run mobile:validate:ios

      - name: Validate Android release configuration
        env:
          VITE_API_URL: https://soulcodex.up.railway.app
          VITE_RELEASE_VERSION: 4.1.0
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_API_CONTRACT: foundation-v4
        run: npm run mobile:validate:android

      - name: Write accessibility/device receipt
        shell: bash
        run: |
          {
            echo "SHA=$GITHUB_SHA"
            echo "policy=user-zoom-remains-enabled"
            echo "policy=reduced-motion-honored-by-css-and-framer-motion"
            echo "policy=bootstrap-and-route-loading-are-announced"
            echo "policy=bootstrap-failure-has-keyboard-accessible-retry"
            echo "policy=keyboard-skip-target-exists"
            echo "policy=mobile-navigation-targets-and-safe-areas"
            echo "policy=checkbox-hit-area-expanded-without-visual-bloat"
            echo "policy=no-high-or-critical-runtime-audit-findings"
            echo "policy=ios-android-release-config-validation"
          } > ACCESSIBILITY-DEVICE-ACCEPTANCE-RECEIPT.txt

      - name: Upload accessibility/device receipt
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-device-acceptance-receipt
          path: ACCESSIBILITY-DEVICE-ACCEPTANCE-RECEIPT.txt
          retention-days: 90
