name: Federation Mean Node Production

on:
  push:
    branches:
      - fed-mean-node-production-policy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mean-node-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build workspaces
        run: npm run build:workspaces
      - name: Typecheck
        run: npm run check
      - name: Mean node production regression
        run: node --import tsx --test tests/lunar-node-evidence.test.ts tests/lunar-node-production.test.ts
      - name: Preserve exact candidate SHA
        run: printf '%s\n' "$GITHUB_SHA" > MEAN-NODE-PRODUCTION-SHA.txt
      - name: Upload qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: mean-node-production-qualification
          path: MEAN-NODE-PRODUCTION-SHA.txt
          retention-days: 90
