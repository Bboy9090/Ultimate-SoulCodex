name: Dependency Baseline Repair

on:
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "packages/*/tsconfig.json"
      - ".github/workflows/dependency-baseline-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate lockfile from repaired manifest
        shell: bash
        run: |
          set -o pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --loglevel verbose 2>&1 | tee npm-lock-generation.log

      - name: Verify clean reproducible install
        shell: bash
        run: |
          set -o pipefail
          rm -rf node_modules
          npm ci --loglevel verbose 2>&1 | tee npm-ci-verification.log

      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Generated lockfile is already current."
            exit 0
          fi
          git commit -m "fix(ci): regenerate workspace lockfile"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Verify workspace discovery
        shell: bash
        run: |
          set -o pipefail
          npm ls --workspaces --depth=0 2>&1 | tee workspace-discovery.log

      - name: Build workspaces
        shell: bash
        run: |
          set -o pipefail
          npm run build:workspaces 2>&1 | tee workspace-build.log

      - name: Check workspaces
        shell: bash
        run: |
          set -o pipefail
          npm run check:workspaces 2>&1 | tee workspace-check.log

      - name: Run workspace tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee workspace-test.log

      - name: Upload dependency repair logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-baseline-repair-logs
          path: |
            npm-lock-generation.log
            npm-ci-verification.log
            workspace-discovery.log
            workspace-build.log
            workspace-check.log
            workspace-test.log
          if-no-files-found: warn
          retention-days: 7
