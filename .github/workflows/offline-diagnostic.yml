name: Offline Runtime Diagnostic

on:
  pull_request:
    paths:
      - "packages/core/offline-codex/**"
      - "packages/core/index.ts"
      - "client/src/lib/offlineProfileStore.ts"
      - "client/src/pages/local-first-input-form.tsx"
      - "client/src/pages/offline-profile.tsx"
      - "client/src/App.tsx"
      - ".github/workflows/offline-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Build core and print focused errors
        shell: bash
        run: |
          set +e
          npm run build -w @soulcodex/core > /tmp/offline-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "error TS|Error:|npm error" /tmp/offline-build.log || tail -80 /tmp/offline-build.log
            exit "$status"
          fi
          cat /tmp/offline-build.log
      - name: Run offline runtime tests
        run: node --import tsx --test packages/core/offline-codex/__tests__/offline-codex.test.ts
      - name: Build application
        run: npm run build
