name: Offline Runtime Diagnostic

on:
  pull_request:
    paths:
      - "packages/core/offline-codex/**"
      - "packages/core/index.ts"
      - "client/src/lib/offlineProfileStore.ts"
      - "client/src/pages/local-first-input-form.tsx"
      - "client/src/pages/offline-profile.tsx"
      - "client/src/App.tsx"
      - ".github/workflows/offline-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Build core and capture focused errors
        id: core-build
        shell: bash
        run: |
          set +e
          npm run build -w @soulcodex/core > /tmp/offline-build.log 2>&1
          status=$?
          grep -E "error TS|Error:|npm error" /tmp/offline-build.log > /tmp/offline-errors.log || true
          if [ ! -s /tmp/offline-errors.log ]; then
            tail -120 /tmp/offline-build.log > /tmp/offline-errors.log
          fi
          cat /tmp/offline-errors.log
          exit "$status"
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-runtime-diagnostic
          path: |
            /tmp/offline-build.log
            /tmp/offline-errors.log
          if-no-files-found: error
      - name: Run offline runtime tests
        run: node --import tsx --test packages/core/offline-codex/__tests__/offline-codex.test.ts
      - name: Build application
        run: npm run build
