name: Gate 4 Lifecycle Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "client/src/App.tsx"
      - "client/src/pages/SettingsPage.tsx"
      - "client/src/pages/AccountDeletionPage.tsx"
      - "client/src/pages/CompatibilityExplorerPage.tsx"
      - "client/src/pages/offline-profile.tsx"
      - "client/src/lib/queryClient.ts"
      - "client/src/lib/api-url.ts"
      - "client/src/lib/ActiveProfileRepository.ts"
      - "client/src/lib/offlineProfileStore.ts"
      - "client/src/lib/__tests__/ActiveProfileRepository.test.ts"
      - "client/src/lib/v4ReleaseManifest.ts"
      - "server/auth/**"
      - "server/routes/consumer-auth.ts"
      - "server/routes.ts"
      - "server/index.ts"
      - "server/storage.ts"
      - "server/session.ts"
      - "server/db.ts"
      - "shared/schema.ts"
      - "tests/active-consumer-auth.test.ts"
      - "tests/active-consumer-auth-postgres.test.ts"
      - "tests/native-api-routing.test.ts"
      - "tests/gate4-profile-lifecycle.test.ts"
      - "tests/account-deletion.test.ts"
      - "tests/gate4-production-deletion.test.ts"
      - "tests/pwa/**"
      - "governance/**"
      - "docs/SOUL_CODEX_V4_RELEASE_READINESS.md"
      - ".github/workflows/gate4-lifecycle-validation.yml"
      - ".github/workflows/pwa-offline-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate4-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-contracts:
    name: Profile, auth, and deletion contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soulcodex
          POSTGRES_PASSWORD: soulcodex
          POSTGRES_DB: soulcodex_gate4
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U soulcodex -d soulcodex_gate4"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://soulcodex:soulcodex@127.0.0.1:5432/soulcodex_gate4
      SESSION_SECRET: gate4-ci-session-secret
      NODE_ENV: test

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact candidate SHA
        run: |
          echo "candidate_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build:workspaces

      - name: Prepare isolated Gate 4 PostgreSQL schema
        run: npx drizzle-kit push --force

      - name: Run Gate 4 profile lifecycle contracts
        run: node --import tsx --test tests/gate4-profile-lifecycle.test.ts

      - name: Run active consumer auth contract against PostgreSQL
        run: node --import tsx --test tests/active-consumer-auth-postgres.test.ts

      - name: Run native API routing contract
        run: node --import tsx --test tests/native-api-routing.test.ts

      - name: Run account deletion storage contracts
        shell: bash
        run: |
          set -o pipefail
          npm run test:account-deletion 2>&1 | tee gate4-account-deletion.log

      - name: Run real route plus PostgreSQL deletion proof
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test tests/gate4-production-deletion.test.ts 2>&1 | tee gate4-production-deletion.log

      - name: Upload deletion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate4-account-deletion-log
          path: |
            gate4-account-deletion.log
            gate4-production-deletion.log
          if-no-files-found: warn
          retention-days: 7

  persistent-offline-browser:
    name: Chromium and WebKit lifecycle journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact candidate SHA
        run: |
          echo "candidate_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.54.1

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Build workspace packages
        run: npm run build:workspaces

      - name: Build production application and PWA assets
        run: npm run build

      - name: Run persistent profile, offline restart, and account deletion restart journeys
        run: >-
          npx playwright test
          tests/pwa/foundation-profile-journey.spec.mjs
          tests/pwa/account-deletion-restart.spec.mjs
          --config=tests/pwa/playwright.config.mjs

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate4-browser-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results/pwa
          if-no-files-found: warn
          retention-days: 7
