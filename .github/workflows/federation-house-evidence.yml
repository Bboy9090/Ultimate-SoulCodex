name: Federation Equal House Evidence

on:
  push:
    branches:
      - fed-equal-house-mc-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiss-fixture-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build workspaces
        run: npm run build:workspaces
      - name: Typecheck
        run: npm run check
      - name: Verify Equal House and MC fixtures
        run: node --import tsx --test tests/house-evidence.test.ts
      - name: Generate house evidence receipt
        run: node --import tsx scripts/generate-house-evidence.ts equal-house-evidence-receipt.json
      - name: Preserve exact candidate SHA
        run: printf '%s\n' "$GITHUB_SHA" > HOUSE-EVIDENCE-SHA.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: equal-house-evidence-receipt
          path: |
            equal-house-evidence-receipt.json
            HOUSE-EVIDENCE-SHA.txt
          if-no-files-found: error
          retention-days: 90
