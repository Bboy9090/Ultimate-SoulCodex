name: Dependency Remediation Lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - security/dependency-remediation
    paths:
      - .github/workflows/dependency-remediation-lockfile.yml

permissions:
  contents: write

concurrency:
  group: dependency-remediation-lockfile
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade vulnerable direct dependencies and refresh lockfile
        run: |
          npm install --save-exact drizzle-orm@0.45.2 sharp@0.35.3 vite@8.2.0
          npm install --save-dev --save-exact drizzle-kit@0.31.10

      - name: Verify production and full dependency audit thresholds
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Run typecheck and build
        run: |
          npm run check
          npm run build

      - name: Commit remediated manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): upgrade vulnerable dependencies"
          git push origin HEAD:security/dependency-remediation
