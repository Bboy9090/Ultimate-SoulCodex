name: Federation Aspect Engine

on:
  push:
    branches:
      - fed-aspect-engine-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-aspects:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build workspaces
        run: npm run build:workspaces
      - name: Typecheck
        run: npm run check
      - name: Aspect engine contract
        run: node --import tsx --test tests/aspect-engine.test.ts
      - name: Preserve exact candidate SHA
        run: printf '%s\n' "$GITHUB_SHA" > ASPECT-ENGINE-SHA.txt
      - name: Upload qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: aspect-engine-qualification
          path: ASPECT-ENGINE-SHA.txt
          retention-days: 90
