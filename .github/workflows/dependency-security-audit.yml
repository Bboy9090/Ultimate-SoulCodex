name: Dependency Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/dependency-security-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce production high-severity threshold
        run: npm audit --omit=dev --audit-level=high

      - name: Enforce full-tree high-severity threshold
        run: npm audit --audit-level=high

      - name: Capture audit evidence
        if: always()
        run: |
          mkdir -p evidence
          npm audit --json > evidence/npm-audit.json || true

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 2
