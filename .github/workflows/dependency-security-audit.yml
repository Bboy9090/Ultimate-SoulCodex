name: Dependency Security Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture full npm audit evidence
        shell: bash
        run: |
          mkdir -p evidence
          npm audit --json > evidence/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('evidence/npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const rows = Object.entries(vulnerabilities).map(([name, value]) => ({
            name,
            severity: value.severity,
            direct: Boolean(value.isDirect),
            via: Array.isArray(value.via)
              ? value.via.map(item => typeof item === 'string' ? item : item.title || item.name || 'advisory')
              : [],
            range: value.range,
            fixAvailable: value.fixAvailable,
            nodes: value.nodes || [],
          }));
          const summary = {
            metadata: report.metadata,
            vulnerabilities: rows,
          };
          fs.writeFileSync('evidence/npm-audit-summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  remediate:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/dependency-remediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade compatible security dependency set and refresh lockfile
        run: |
          npm install --save-exact drizzle-orm@0.45.2 sharp@0.35.3 vite@8.2.0 esbuild@0.28.1 @vitejs/plugin-react@latest drizzle-kit@0.31.10

      - name: Verify audit thresholds
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Run typecheck and build
        run: |
          npm run check
          npm run build

      - name: Commit remediated manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): upgrade vulnerable dependencies"
          git push origin HEAD:security/dependency-remediation
