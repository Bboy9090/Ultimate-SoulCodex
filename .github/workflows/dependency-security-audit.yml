name: Dependency Security Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'fix/profile-verification-reconciliation-v1' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking security updates
        run: npm audit fix

      - name: Enforce production high-severity threshold
        run: npm audit --omit=dev --audit-level=high

      - name: Enforce full-tree high-severity threshold
        run: npm audit --audit-level=high

      - name: Typecheck repaired tree
        run: npm run check

      - name: Run workspace tests
        run: npm test

      - name: Build repaired application
        run: npm run build

      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency manifest changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): refresh transitive dependency lock'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce production high-severity threshold
        run: npm audit --omit=dev --audit-level=high

      - name: Enforce full-tree high-severity threshold
        run: npm audit --audit-level=high

      - name: Capture full npm audit evidence
        shell: bash
        run: |
          mkdir -p evidence
          npm audit --json > evidence/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('evidence/npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const rows = Object.entries(vulnerabilities).map(([name, value]) => ({
            name,
            severity: value.severity,
            direct: Boolean(value.isDirect),
            via: Array.isArray(value.via)
              ? value.via.map(item => typeof item === 'string' ? item : item.title || item.name || 'advisory')
              : [],
            range: value.range,
            fixAvailable: value.fixAvailable,
            nodes: value.nodes || [],
          }));
          const summary = {
            metadata: report.metadata,
            vulnerabilities: rows,
          };
          fs.writeFileSync('evidence/npm-audit-summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: evidence/
          if-no-files-found: error
          retention-days: 90
