name: Workshop financial evidence bridge
on:
  pull_request:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --experimental-strip-types --test tests/workshop-profit-evidence.test.mjs
      - run: python -m unittest discover -s scripts -p 'test_workshop_billing_reconciliation.py' -v
