name: PR158 Lockfile Security Remediation

on:
  push:
    branches:
      - fix/profile-verification-reconciliation-v1

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/profile-verification-reconciliation-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking npm security updates
        run: npm audit fix

      - name: Enforce production high-severity threshold
        run: npm audit --omit=dev --audit-level=high

      - name: Enforce full-tree high-severity threshold
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run check

      - name: Run workspace tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Commit repaired dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No lockfile changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): refresh transitive dependency lock'
          git push origin HEAD:fix/profile-verification-reconciliation-v1
