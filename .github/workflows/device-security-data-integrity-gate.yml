name: Device Security Data Integrity Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-security-data-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspaces
        run: npm run build:workspaces

      - name: Security, privacy, persistence, reconciliation, and differentiation regressions
        run: >-
          node --import tsx --test
          tests/trusted-mutation-origin.test.ts
          tests/production-schema-preflight.test.ts
          tests/billing-security.test.ts
          tests/web-checkout-pricing-contract.test.ts
          tests/product-entitlement-contract.test.ts
          tests/canonical-billing-path-contract.test.ts
          tests/billing-retention-privacy-contract.test.ts
          tests/auth-billing-privacy-contract.test.ts
          tests/native-billing-bridge-contract.test.ts
          tests/native-billing-server-verification-contract.test.ts
          tests/native-billing-lifecycle-contract.test.ts
          tests/native-billing-lifecycle-behavior.test.ts
          tests/offline-entitlement-cache-contract.test.ts
          tests/offline-entitlement-cache-behavior.test.ts
          tests/billing-production-readiness-contract.test.ts
          tests/store-privacy-billing-disclosure-contract.test.ts
          tests/release-4.1-identity-contract.test.ts
          tests/store-catalog-handoff-contract.test.ts
          tests/web-apple-auth-billing-contract.test.ts
          tests/full-birth-name-persistence-contract.test.ts
          tests/production-persistence-truth.test.ts
          tests/persistence-readiness.test.ts
          tests/integration-readiness.test.ts
          tests/public-profile-projection.test.ts
          tests/share-privacy-accessibility-contract.test.ts
          tests/pwa-update-lifecycle-contract.test.ts
          tests/public-api-error-privacy.test.ts
          tests/safe-diagnostics-security-headers.test.ts
          tests/storage-public-share-deletion.test.ts
          tests/account-deletion-local-cleanup-truth.test.ts
          tests/privacy-public-share-truth.test.ts
          tests/store-release-candidate-contract.test.ts
          tests/offline-profile-lazy-chart-contract.test.ts
          tests/human-design-bodygraph-bundle-boundary.test.ts
          tests/accessibility-device-acceptance-contract.test.ts
          tests/form-accessibility-recovery-contract.test.ts
          tests/profile-verification-reconciliation.test.ts
          tests/profile-verification-boundary.test.ts
          tests/known-time-profile-verification-http.test.ts
          tests/human-design-complete-input-matrix.test.ts
          tests/human-design-availability.test.ts
          tests/server-profile-human-design-parity.test.ts
          tests/stored-profile-system-verification.test.ts
          tests/server-symbolic-fallback.test.ts
          tests/foundation-local-truth-invariants.test.ts
          tests/active-profile-contract.test.ts
          tests/timeline-today-card.test.ts
          client/src/lib/__tests__/foundationOfflineCodexRepair.test.ts
          tests/local-first-verification-failure-truth.test.ts
          tests/verified-profile-differentiation-corpus.test.ts
          server/tests/gate1-foundation.test.ts

      - name: Reject destructive public-share startup schema operations
        shell: bash
        run: |
          if grep -Eiq 'DROP[[:space:]]+TABLE|ALTER[[:space:]]+TABLE.+DROP' scripts/ensure-public-share-schema.mjs; then
            echo "Destructive schema operation detected in production preflight."
            exit 1
          fi

      - name: Audit production dependencies for high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Foundation truth and privacy invariants
        run: node scripts/verify-foundation-web-rc.mjs

      - name: Validate provider configuration readiness
        run: npm run validate:integrations

      - name: Typecheck
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Validate iOS release configuration
        env:
          VITE_API_URL: https://soulcodex.up.railway.app
          VITE_RELEASE_VERSION: 4.1.0
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_API_CONTRACT: foundation-v4
        run: npm run mobile:validate:ios

      - name: Validate Android release configuration
        env:
          VITE_API_URL: https://soulcodex.up.railway.app
          VITE_RELEASE_VERSION: 4.1.0
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_API_CONTRACT: foundation-v4
        run: npm run mobile:validate:android

      - name: Write hardening receipt
        shell: bash
        run: |
          {
            echo "SHA=$GITHUB_SHA"
            echo "policy=session-backed-mutations-require-trusted-origin"
            echo "policy=public-share-schema-preflight-is-idempotent-and-non-destructive"
            echo "policy=durable-billing-ledger-and-signed-subscription-verification"
            echo "policy=native-store-evidence-requires-server-verification-and-account-binding"
            echo "policy=production-persistence-mode-is-explicit-and-durable-features-fail-closed"
            echo "policy=enabled-provider-configuration-fails-closed-without-claiming-production-activation"
            echo "policy=railway-promotion-requires-live-database-readiness"
            echo "policy=account-deletion-removes-public-shares"
            echo "policy=public-share-projection-excludes-private-birth-and-assessment-data"
            echo "policy=pwa-updates-preserve-current-and-previous-shells"
            echo "policy=client-api-errors-never-echo-arbitrary-response-bodies"
            echo "policy=public-share-disclosures-match-product"
            echo "policy=canonical-offline-profile-persistence-regression"
            echo "policy=partial-verification-cannot-downgrade-local-profile"
            echo "policy=verified-profile-differentiation-corpus"
            echo "policy=ios-android-release-config-validation"
          } > DEVICE-SECURITY-DATA-INTEGRITY-RECEIPT.txt

      - name: Upload hardening receipt
        uses: actions/upload-artifact@v4
        with:
          name: device-security-data-integrity-receipt
          path: DEVICE-SECURITY-DATA-INTEGRITY-RECEIPT.txt
          retention-days: 90
