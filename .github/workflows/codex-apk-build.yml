name: Codex APK Build
on:
  push:
    branches:
      - 'codex/apk-build-2026-08-23'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_API_URL: https://soulcodex.up.railway.app
      VITE_RELEASE_VERSION: 4.0.0-rc.3
      VITE_RELEASE_SHA: ${{ github.sha }}
      VITE_API_CONTRACT: foundation-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --ignore-scripts
      - run: npm run build -w @soulcodex/db
      - run: npm run build -w @soulcodex/core
      - run: npm run mobile:validate:android
      - run: npm run build
      - run: npx cap sync android
      - working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ultimate-SoulCodex-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          retention-days: 30
