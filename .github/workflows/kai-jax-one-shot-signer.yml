name: Kai-Jax One-Shot Signed AAB

on:
  push:
    branches:
      - ops/kai-jax-signed-aab

permissions:
  contents: read

jobs:
  sign-kai-jax:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SOURCE_REPO: Bboy9090/Legends-of-Kai-Jax-The-memory-Hero
      SOURCE_SHA: d76590f7dd7e09665416c8784700f26f25d00912
      APP_DIR: apps/web/android
    steps:
      - name: Validate signing credentials
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact Kai-Jax source
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/$SOURCE_REPO.git" source
          cd source
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Prepare Kai-Jax Android source
        working-directory: source
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --filter ./apps/web... --frozen-lockfile
          pnpm -C apps/web build
          cd apps/web
          npx cap sync android
          chmod +x android/gradlew

      - name: Materialize temporary signing key
        working-directory: source
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$APP_DIR/portfolio-release.jks"
          test -s "$APP_DIR/portfolio-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$PWD/$APP_DIR/portfolio-release.jks" >> "$GITHUB_ENV"

      - name: Build and verify signed AAB
        working-directory: source
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" clean bundleRelease --stacktrace
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$AAB" "$GITHUB_WORKSPACE/out/Legends-of-Kai-Jax-d76590f7-signed.aab"
          sha256sum "$AAB" | tee "$GITHUB_WORKSPACE/out/AAB-SHA256.txt"
          keytool -printcert -jarfile "$AAB" | grep -E 'SHA1:|SHA256:' | tee "$GITHUB_WORKSPACE/out/SIGNING-CERT-FINGERPRINTS.txt"
          printf '%s\n' "$SOURCE_REPO@$SOURCE_SHA" > "$GITHUB_WORKSPACE/out/SOURCE.txt"

      - name: Upload signed AAB evidence
        uses: actions/upload-artifact@v4
        with:
          name: kai-jax-signed-aab-d76590f7
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary key
        if: always()
        run: rm -f "source/$APP_DIR/portfolio-release.jks"
