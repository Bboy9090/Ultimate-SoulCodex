name: Federation Subsystem Gate

on:
  pull_request:
    branches:
      - release/ios-4.0.0-federation-integrated
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: federation-subsystem-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build workspaces
        run: npm run build:workspaces
      - name: Typecheck
        run: npm run check
      - name: Canonical numerology regression
        run: node --import tsx --test packages/core/__tests__/numerology-date-only.test.ts
      - name: Moon/Rising and planetary regression
        run: node --import tsx --test tests/bobby-big-three-golden.test.ts tests/ascendant-retry-contract.test.ts tests/astrology-planetary-candidates.test.ts tests/astrology-production-verification.test.ts tests/full-chart-production-wiring.test.ts tests/house-production.test.ts tests/aspect-engine.test.ts tests/lunar-node-evidence.test.ts tests/lunar-node-production.test.ts tests/chiron-horizons-reference.test.ts tests/chiron-production.test.ts
      - name: Privacy and local-first regression
        run: node --import tsx --test tests/local-first-privacy-contract.test.ts tests/profile-verification-reconciliation.test.ts tests/profile-verification-boundary.test.ts
      - name: Truth-bound differentiation regression
        run: node --import tsx --test packages/core/offline-codex/__tests__/truth-bound-differentiation.test.ts
      - name: Verified narrative differentiation regression
        run: node --import tsx --test tests/verified-profile-differentiation.test.ts
      - name: Human Design verified-core trust contract
        run: node --import tsx --test tests/human-design-differential-contract.test.ts tests/human-design-trust.test.ts
      - name: Verified profile differentiation corpus
        run: node --import tsx --test tests/offline-synthesis-evidence-boundary.test.ts tests/verified-profile-differentiation-corpus.test.ts
