name: Build iOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - app-store

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages
        run: |
          npm run build -w @soulcodex/db
          npm run build -w @soulcodex/core

      - name: Validate mobile release configuration
        run: npm run mobile:validate:ios

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS (Development)
        if: inputs.build_type == 'development'
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme "Soul Codex" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Import signing certificate
        if: inputs.build_type == 'app-store'
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: inputs.build_type == 'app-store'
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          test -n "$IOS_PROVISIONING_PROFILE"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS (App Store)
        if: inputs.build_type == 'app-store'
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme "Soul Codex" \
            -configuration Release \
            -archivePath build/SoulCodex.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath build/SoulCodex.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ../../scripts/ExportOptions.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ inputs.build_type }}
          path: |
            ios/App/build/export/*.ipa
            ios/App/build/Build/Products/**/*.app
          if-no-files-found: warn
