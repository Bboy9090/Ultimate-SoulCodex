name: Build iOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - app-store

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://soulcodex.up.railway.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bootstrap JavaScript and local Swift packages
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://soulcodex.up.railway.app' }}
        run: sh ios/App/ci_scripts/ci_post_clone.sh

      - name: Validate mobile release configuration
        run: npm run mobile:validate:ios

      - name: Resolve Xcode package dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme "Soul Codex"

      - name: Build iOS (Development)
        if: inputs.build_type == 'development'
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme "Soul Codex" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -verbose \
            build 2>&1 | tee build.log

      - name: Import signing certificate
        if: inputs.build_type == 'app-store'
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: inputs.build_type == 'app-store'
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          test -n "$IOS_PROVISIONING_PROFILE"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS (App Store)
        if: inputs.build_type == 'app-store'
        run: |
          cd ios/App
          mkdir -p build

          echo "Creating archive..."
          xcodebuild -project App.xcodeproj \
            -scheme "Soul Codex" \
            -configuration Release \
            -archivePath build/SoulCodex.xcarchive \
            -verbose \
            archive 2>&1 | tee archive.log

          if [ ! -d "build/SoulCodex.xcarchive" ]; then
            echo "Archive creation failed!"
            exit 1
          fi

          echo "Exporting archive..."
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/SoulCodex.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -verbose 2>&1 | tee export.log

          if [ ! -f "build/export/Soul Codex.ipa" ] && [ ! -f "build/export/SoulCodex.ipa" ]; then
            echo "IPA export failed!"
            ls -la build/export/
            exit 1
          fi

      - name: List build artifacts
        if: always()
        run: |
          echo "=== Build Output ==="
          find ios/App/build -type f -name "*.ipa" -o -name "*.app" 2>/dev/null || echo "No artifacts found"
          echo ""
          echo "=== Build Directory Contents ==="
          ls -lah ios/App/build/ 2>/dev/null || echo "Build directory not found"

      - name: Upload artifact (App Store)
        if: inputs.build_type == 'app-store'
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-build
          path: ios/App/build/export/
          retention-days: 30

      - name: Upload artifact (Development)
        if: inputs.build_type == 'development'
        uses: actions/upload-artifact@v4
        with:
          name: ios-development-build
          path: ios/App/build/Build/Products/Debug-iphonesimulator/
          if-no-files-found: warn
          retention-days: 7
