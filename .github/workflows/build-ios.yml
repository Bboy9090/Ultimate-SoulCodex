name: Build iOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - app-store

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://soulcodex.up.railway.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bootstrap JavaScript and local Swift packages
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: sh ios/App/ci_scripts/ci_post_clone.sh

      - name: Validate mobile release configuration
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://soulcodex.up.railway.app' }}
        run: npm run mobile:validate:ios

      - name: Resolve Xcode package dependencies
        run: |
          cd ios/App
          echo "Resolving Swift package dependencies..."
          xcodebuild -workspace App.xcodeproj/project.xcworkspace \
            -scheme "Soul Codex" \
            -resolvePackageDependencies

      - name: Build iOS (Development)
        if: inputs.build_type == 'development'
        run: |
          cd ios/App
          echo "Building for iOS Simulator..."
          xcodebuild -workspace App.xcodeproj/project.xcworkspace \
            -scheme "Soul Codex" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify signing secrets
        if: inputs.build_type == 'app-store'
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "Checking for required secrets..."
          if [ -z "$IOS_CERTIFICATE_P12" ]; then
            echo "❌ Error: IOS_CERTIFICATE_P12 secret is not set"
            echo "Please configure GitHub Secrets: https://github.com/Bboy9090/Ultimate-SoulCodex/settings/secrets/actions"
            exit 1
          fi
          if [ -z "$IOS_CERTIFICATE_PASSWORD" ]; then
            echo "❌ Error: IOS_CERTIFICATE_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "❌ Error: IOS_PROVISIONING_PROFILE secret is not set"
            exit 1
          fi
          echo "✅ All signing secrets are configured"

      - name: Import signing certificate
        if: inputs.build_type == 'app-store'
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: inputs.build_type == 'app-store'
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "Installing provisioning profile..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          if [ ! -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision ]; then
            echo "❌ Failed to install provisioning profile"
            exit 1
          fi

          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "✅ Provisioning profile installed"

      - name: Audit provisioning profile
        if: inputs.build_type == 'app-store'
        run: |
          echo "=== Auditing Provisioning Profile ==="
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          if [ ! -f "$PROFILE_PATH" ]; then
            echo "❌ Profile not found at $PROFILE_PATH"
            exit 1
          fi

          echo "Profile file size: $(stat -f%z "$PROFILE_PATH" 2>/dev/null || stat -c%s "$PROFILE_PATH")"

          # Extract the embedded plist from the .mobileprovision file
          echo ""
          echo "Extracting and parsing profile plist..."
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist

          # Use plutil or plistbuddy to extract key fields
          echo ""
          echo "Profile Details:"
          echo "================"

          # Name
          NAME=$(plutil -extract Name raw /tmp/profile.plist 2>/dev/null || echo "N/A")
          echo "Name: $NAME"

          # UUID
          UUID=$(plutil -extract UUID raw /tmp/profile.plist 2>/dev/null || echo "N/A")
          echo "UUID: $UUID"

          # TeamIdentifier
          TEAM=$(plutil -extract TeamIdentifier.0 raw /tmp/profile.plist 2>/dev/null || echo "N/A")
          echo "TeamIdentifier: $TEAM"

          # application-identifier
          APP_ID=$(plutil -extract Entitlements.application-identifier raw /tmp/profile.plist 2>/dev/null || echo "N/A")
          echo "application-identifier: $APP_ID"

          # ExpirationDate
          EXP_DATE=$(plutil -extract ExpirationDate raw /tmp/profile.plist 2>/dev/null || echo "N/A")
          echo "ExpirationDate: $EXP_DATE"

          # get-task-allow
          GET_TASK=$(plutil -extract Entitlements.get-task-allow raw /tmp/profile.plist 2>/dev/null || echo "N/A")
          echo "get-task-allow: $GET_TASK"

          # ProvisionedDevices - check if key exists (it should NOT exist for App Store profile)
          if plutil -extract ProvisionedDevices /tmp/profile.plist >/dev/null 2>&1; then
            DEVICES="PRESENT"
          else
            DEVICES="ABSENT"
          fi
          echo "ProvisionedDevices: $DEVICES"

          echo ""
          echo "=== Validation ==="

          # Validate TeamIdentifier
          if [ "$TEAM" = "86NUJ8M3B8" ]; then
            echo "✅ TeamIdentifier matches 86NUJ8M3B8"
          else
            echo "❌ TeamIdentifier mismatch: expected 86NUJ8M3B8, got $TEAM"
            exit 1
          fi

          # Validate application-identifier
          if [ "$APP_ID" = "86NUJ8M3B8.app.soulcodex.ios" ]; then
            echo "✅ application-identifier matches"
          else
            echo "❌ application-identifier mismatch: expected 86NUJ8M3B8.app.soulcodex.ios, got $APP_ID"
            exit 1
          fi

          # Validate get-task-allow
          if [ "$GET_TASK" = "0" ] || [ "$GET_TASK" = "false" ]; then
            echo "✅ get-task-allow is false (release profile)"
          else
            echo "❌ get-task-allow is not false: $GET_TASK"
            exit 1
          fi

          # Validate ProvisionedDevices is absent (App Store profiles should not have device restrictions)
          if [ "$DEVICES" = "ABSENT" ]; then
            echo "✅ ProvisionedDevices is absent (distribution profile)"
          else
            echo "❌ ProvisionedDevices present (should be absent for App Store)"
            exit 1
          fi

          # Check expiration
          EPOCH=$(date -jf "%Y-%m-%dT%H:%M:%SZ" "$EXP_DATE" +%s 2>/dev/null || echo "0")
          NOW=$(date +%s)
          if [ "$EPOCH" -gt "$NOW" ]; then
            echo "✅ Profile is not expired"
          else
            echo "❌ Profile is expired"
            exit 1
          fi

          echo ""
          echo "=== Certificate Fingerprints ==="
          # Extract certificates
          security cms -D -i "$PROFILE_PATH" -o /tmp/profile.der 2>&1 | grep -i cert || true

          echo "✅ Provisioning profile audit passed"
          echo "UUID for xcodebuild: $UUID"
          echo "$UUID" > /tmp/profile_uuid.txt

      - name: Verify certificate fingerprints
        if: inputs.build_type == 'app-store'
        run: |
          echo "=== Certificate Fingerprint Verification ==="
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          echo "Extracting embedded certificates from provisioning profile..."
          security cms -D -i "$PROFILE_PATH" -o /tmp/profile.der 2>&1

          # Extract and list embedded certificates
          echo ""
          echo "Embedded certificates in profile:"
          /usr/libexec/PlistBuddy -c "Print :DeveloperCertificates" /tmp/profile.plist 2>/dev/null | head -20

          echo ""
          echo "Installed code signing identities:"
          security find-identity -v -p codesigning

          echo ""
          echo "✅ Certificate extraction complete - visually compare fingerprints above"

      - name: Verify entitlements
        if: inputs.build_type == 'app-store'
        run: |
          echo "=== Entitlements Verification ==="
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          echo "Extracting entitlements from provisioning profile..."
          plutil -extract Entitlements xml1 /tmp/profile.plist -o /tmp/entitlements.plist 2>/dev/null

          echo ""
          echo "Profile entitlements:"
          cat /tmp/entitlements.plist

          # List expected entitlements for SoulCodex
          echo ""
          echo "Expected entitlements for app.soulcodex.ios:"
          echo "  - application-identifier: 86NUJ8M3B8.app.soulcodex.ios"
          echo "  - aps-environment: (absent for App Store)"
          echo "  - get-task-allow: 0 (false for release)"
          echo "  - keychain-access-groups: optional"

          echo ""
          echo "✅ Entitlements extraction complete"

      - name: Install provisioning profile by UUID
        if: inputs.build_type == 'app-store'
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          echo "Installing provisioning profile using UUID as filename..."
          PROFILE_UUID="9252a540-f85f-41c8-824e-e454b37f562f"
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles

          # Create the directory if it doesn't exist
          mkdir -p "$PROFILE_DIR"

          # Decode and install profile with UUID filename
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          if [ ! -f "$PROFILE_DIR/$PROFILE_UUID.mobileprovision" ]; then
            echo "❌ Failed to install provisioning profile with UUID"
            exit 1
          fi

          echo "✅ Provisioning profile installed at $PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          ls -lah "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

      - name: Build iOS (App Store)
        if: inputs.build_type == 'app-store'
        env:
          PROVISIONING_PROFILE_SPECIFIER: "9252a540-f85f-41c8-824e-e454b37f562f"
          DEVELOPMENT_TEAM: "86NUJ8M3B8"
          CODE_SIGN_STYLE: "Manual"
        run: |
          cd ios/App
          mkdir -p build

          echo "Creating archive with provisioning profile UUID..."
          echo "PROVISIONING_PROFILE_SPECIFIER: $PROVISIONING_PROFILE_SPECIFIER"
          echo "DEVELOPMENT_TEAM: $DEVELOPMENT_TEAM"
          echo "CODE_SIGN_STYLE: $CODE_SIGN_STYLE"

          xcodebuild -workspace App.xcodeproj/project.xcworkspace \
            -scheme "Soul Codex" \
            -configuration Release \
            -archivePath build/SoulCodex.xcarchive \
            -allowProvisioningUpdates \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="$CODE_SIGN_STYLE" \
            CODE_SIGN_IDENTITY="-" \
            -verbose \
            archive 2>&1 | tee archive.log

          if [ ! -d "build/SoulCodex.xcarchive" ]; then
            echo "❌ Archive creation failed!"
            echo ""
            echo "Last 100 lines of archive log:"
            tail -100 archive.log
            exit 1
          fi

          echo "✅ Archive created successfully"
          ls -lah build/SoulCodex.xcarchive

          echo ""
          echo "Exporting archive..."
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/SoulCodex.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ../../scripts/ExportOptions.plist \
            -allowProvisioningUpdates \
            -verbose 2>&1 | tee export.log

          echo ""
          echo "Checking for IPA file..."
          if find build/export -name "*.ipa" -type f; then
            echo "✅ IPA export successful"
            ls -lah build/export/
          else
            echo "❌ IPA export failed!"
            echo "Export directory contents:"
            ls -la build/export/
            echo ""
            echo "Last 50 lines of export log:"
            tail -50 export.log
            exit 1
          fi

      - name: Show build summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          echo "Build type: ${{ inputs.build_type }}"
          echo ""

          if [ "${{ inputs.build_type }}" == "development" ]; then
            echo "=== Development Build Artifacts ==="
            find ios/App/build -type d -name "*.app" 2>/dev/null && echo "✅ App bundle found" || echo "⚠️ No app bundle found"
          elif [ "${{ inputs.build_type }}" == "app-store" ]; then
            echo "=== App Store Build Artifacts ==="
            if find ios/App/build/export -name "*.ipa" -type f 2>/dev/null; then
              echo "✅ IPA file(s) found"
              du -sh ios/App/build/export/*.ipa 2>/dev/null | awk '{print "   " $0}'
            else
              echo "⚠️ No IPA files found"
            fi
            echo ""
            echo "Export directory contents:"
            ls -lah ios/App/build/export/ 2>/dev/null || echo "Export directory not found"
          fi

          echo ""
          echo "=== Build Logs Available ==="
          [ -f ios/App/build.log ] && echo "✅ build.log (development)" || true
          [ -f ios/App/archive.log ] && echo "✅ archive.log (app-store)" || true
          [ -f ios/App/export.log ] && echo "✅ export.log (app-store)" || true

      - name: Upload artifact (App Store)
        if: inputs.build_type == 'app-store'
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-build
          path: ios/App/build/export/
          retention-days: 30

      - name: Upload artifact (Development)
        if: inputs.build_type == 'development'
        uses: actions/upload-artifact@v4
        with:
          name: ios-development-build
          path: ios/App/build/Build/Products/Debug-iphonesimulator/
          if-no-files-found: warn
          retention-days: 7
