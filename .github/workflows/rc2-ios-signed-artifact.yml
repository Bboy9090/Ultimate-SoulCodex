name: RC2 Signed iOS Artifact

on:
  push:
    branches: [ops/rc2-ios-signed-artifact]

permissions:
  contents: read

concurrency:
  group: rc2-signed-ios-artifact
  cancel-in-progress: true

env:
  RC_SHA: 2e02d1023ddeb4e453236c34f2d4d2b7f6948957
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://soulcodex.up.railway.app' }}

jobs:
  signed-ios-ipa:
    name: Signed rc2 App Store IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact rc2 merge
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}

      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$RC_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bootstrap native project
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: sh ios/App/ci_scripts/ci_post_clone.sh

      - name: Validate and resolve
        run: |
          npm run mobile:validate:ios
          cd ios/App
          xcodebuild -workspace App.xcodeproj/project.xcworkspace -scheme "Soul Codex" -resolvePackageDependencies

      - name: Verify required iOS signing secrets exist
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          test -n "$IOS_CERTIFICATE_P12" || { echo "MISSING: IOS_CERTIFICATE_P12"; exit 1; }
          test -n "$IOS_CERTIFICATE_PASSWORD" || { echo "MISSING: IOS_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE" || { echo "MISSING: IOS_PROVISIONING_PROFILE"; exit 1; }

      - name: Verify P12 certificate/private-key pair
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/soulcodex-distribution.p12"
          CERT="$RUNNER_TEMP/soulcodex-distribution-cert.pem"
          KEY="$RUNNER_TEMP/soulcodex-distribution-key.pem"
          CERT_PUB="$RUNNER_TEMP/cert-public.der"
          KEY_PUB="$RUNNER_TEMP/key-public.der"

          printf '%s' "$IOS_CERTIFICATE_P12" | base64 -D > "$P12"
          test -s "$P12" || { echo "IOS_P12_DECODE_EMPTY"; exit 1; }

          openssl pkcs12 -in "$P12" -passin "pass:$IOS_CERTIFICATE_PASSWORD" -clcerts -nokeys -out "$CERT" >/dev/null 2>&1 || {
            echo "IOS_P12_CERTIFICATE_EXTRACTION_FAILED"
            exit 1
          }
          openssl pkcs12 -in "$P12" -passin "pass:$IOS_CERTIFICATE_PASSWORD" -nocerts -nodes -out "$KEY" >/dev/null 2>&1 || {
            echo "IOS_P12_PRIVATE_KEY_EXTRACTION_FAILED"
            exit 1
          }
          grep -q 'BEGIN CERTIFICATE' "$CERT" || { echo "IOS_P12_HAS_NO_CERTIFICATE"; exit 1; }
          grep -Eq 'BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY' "$KEY" || { echo "IOS_P12_HAS_NO_PRIVATE_KEY"; exit 1; }
          openssl x509 -in "$CERT" -noout -checkend 0 >/dev/null || { echo "IOS_CERTIFICATE_EXPIRED"; exit 1; }

          openssl x509 -in "$CERT" -pubkey -noout | openssl pkey -pubin -outform DER > "$CERT_PUB"
          openssl pkey -in "$KEY" -pubout -outform DER > "$KEY_PUB"
          cmp -s "$CERT_PUB" "$KEY_PUB" || { echo "IOS_CERTIFICATE_PRIVATE_KEY_MISMATCH"; exit 1; }
          echo "P12 certificate/private-key pair is valid and current."

      - name: Import usable codesigning identity
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/soulcodex-distribution.p12"
          KEYCHAIN="$RUNNER_TEMP/soulcodex-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -f pkcs12 -P "$IOS_CERTIFICATE_PASSWORD" -A
          security default-keychain -d user -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          security find-identity -v -p codesigning "$KEYCHAIN" > "$RUNNER_TEMP/codesigning-identities.txt"
          if ! grep -Eq '[0-9]+\) [0-9A-F]{40} ".+"' "$RUNNER_TEMP/codesigning-identities.txt"; then
            echo "IOS_P12_HAS_NO_VALID_CODESIGNING_IDENTITY"
            exit 1
          fi
          echo "Usable iOS codesigning identity is present in the ephemeral keychain."

      - name: Install and verify provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/SoulCodex.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > "$PROFILE_PATH"
          test -s "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/provisioning-profile.plist"
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/provisioning-profile.plist")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/provisioning-profile.plist")
          test "$PROFILE_TEAM" = "86NUJ8M3B8"
          test "$APP_IDENTIFIER" = "86NUJ8M3B8.app.soulcodex.ios"
          echo "Provisioning profile matches Soul Codex team and bundle identifier."

      - name: Build and export signed App Store IPA
        run: |
          set -euo pipefail
          cd ios/App
          mkdir -p build build/export
          xcodebuild -workspace App.xcodeproj/project.xcworkspace \
            -scheme "Soul Codex" \
            -configuration Release \
            -archivePath build/SoulCodex.xcarchive \
            archive 2>&1 | tee build/archive.log
          test -d build/SoulCodex.xcarchive

          xcodebuild -exportArchive \
            -archivePath build/SoulCodex.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | tee build/export.log

          IPA_PATH=$(find build/export -maxdepth 1 -name '*.ipa' -type f -print -quit)
          test -n "$IPA_PATH"
          test -s "$IPA_PATH"
          shasum -a 256 "$IPA_PATH" | tee build/export/IPA-SHA256.txt
          printf '%s\n' "$RC_SHA" > build/export/RELEASE-CANDIDATE-SHA.txt

      - name: Upload signed rc2 iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: soul-codex-v4-rc2-ios-ipa
          path: |
            ios/App/build/export/*.ipa
            ios/App/build/export/IPA-SHA256.txt
            ios/App/build/export/RELEASE-CANDIDATE-SHA.txt
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/soulcodex-distribution.p12" \
                "$RUNNER_TEMP/soulcodex-distribution-cert.pem" \
                "$RUNNER_TEMP/soulcodex-distribution-key.pem" \
                "$RUNNER_TEMP/cert-public.der" \
                "$RUNNER_TEMP/key-public.der" \
                "$RUNNER_TEMP/codesigning-identities.txt" \
                "$RUNNER_TEMP/provisioning-profile.plist"
          security delete-keychain "$RUNNER_TEMP/soulcodex-signing.keychain-db" >/dev/null 2>&1 || true
