name: iOS Billing Qualification Bootstrap Parity

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "ios/**"
      - "client/**"
      - "server/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-billing-qualification-parity.yml"

permissions:
  contents: read

concurrency:
  group: ios-billing-qualification-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_URL: https://soulcodex.up.railway.app
  VITE_RELEASE_VERSION: 4.1.0
  VITE_API_CONTRACT: foundation-v4
  VITE_RELEASE_SHA: ${{ github.sha }}
  VITE_BILLING_QUALIFICATION_MODE: "true"
  SOUL_CODEX_IOS_QUALIFICATION_BUILD: "true"

jobs:
  qualification-parity:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Record Xcode environment
        run: |
          xcodebuild -version
          xcrun swift --version
          node --version
          npm --version

      - name: Prove qualification markers are both enabled
        run: |
          test "$VITE_BILLING_QUALIFICATION_MODE" = "true"
          test "$SOUL_CODEX_IOS_QUALIFICATION_BUILD" = "true"

      - name: Run real Xcode Cloud post-clone bootstrap in qualification mode
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: sh ios/App/ci_scripts/ci_post_clone.sh

      - name: Validate final iOS release metadata
        run: npm run mobile:validate:ios

      - name: Verify qualification and release contracts
        run: |
          node --import tsx --test             tests/ios-billing-qualification-build-contract.test.ts             tests/xcode-cloud-scheme-contract.test.ts             tests/release-identity.test.ts             tests/store-release-candidate-contract.test.ts

      - name: Resolve Swift package graph after bootstrap
        run: |
          xcodebuild             -resolvePackageDependencies             -project ios/App/App.xcodeproj             -scheme "Ultimate Soul Codex"

      - name: Require checked-in Swift package resolution parity
        run: |
          git diff --exit-code -- ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Create unsigned qualification archive
        run: |
          xcodebuild             -project ios/App/App.xcodeproj             -scheme "Ultimate Soul Codex"             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/SoulCodex-iOS-Billing-Qualification.xcarchive"             CODE_SIGNING_ALLOWED=NO             archive

      - name: Record qualification parity receipt
        if: always()
        run: |
          {
            echo "SHA=$GITHUB_SHA"
            echo "release=4.1.0"
            echo "scheme=Ultimate Soul Codex"
            echo "qualification_mode=true"
            echo "qualification_build=true"
            echo "signed_upload=false"
            echo "purpose=prove dedicated qualification bootstrap/archive before Xcode Cloud TestFlight execution"
          } > ios-billing-qualification-parity-receipt.txt

      - name: Upload qualification parity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soulcodex-ios-billing-qualification-parity
          path: ios-billing-qualification-parity-receipt.txt
          retention-days: 90
