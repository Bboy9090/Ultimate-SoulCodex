name: Depth Quality Diagnostic

on:
  push:
    branches: ["test/codex-depth-quality-gates-v1"]
    paths:
      - "packages/core/depth-interpretation/**"
      - ".github/workflows/depth-quality-diagnostic.yml"

permissions:
  contents: read

jobs:
  focused-quality-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run focused quality tests
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test \
            packages/core/depth-interpretation/__tests__/quality.test.ts \
            packages/core/depth-interpretation/__tests__/quality-regression.test.ts \
            2>&1 | tee depth-quality-test.log

      - name: Upload focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depth-quality-test-log
          path: depth-quality-test.log
          retention-days: 3
