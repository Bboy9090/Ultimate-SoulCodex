name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-apk
          - release-aab

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://soulcodex.up.railway.app' }}
      VITE_RELEASE_VERSION: 4.0.0-rc.3
      VITE_RELEASE_SHA: ${{ github.sha }}
      VITE_API_CONTRACT: foundation-v4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record candidate identity
        run: |
          test "$VITE_RELEASE_SHA" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > release-candidate-sha.txt
          printf '%s\n' "$VITE_RELEASE_VERSION" > release-version.txt
          printf '%s\n' "$VITE_API_CONTRACT" > api-contract.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages
        run: |
          npm run build -w @soulcodex/db
          npm run build -w @soulcodex/core

      - name: Validate mobile release configuration
        run: npm run mobile:validate:android

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -i
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify signing secrets
        if: inputs.build_type != 'debug'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE" || { echo "ANDROID_KEYSTORE secret is not set"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is not set"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is not set"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is not set"; exit 1; }

      - name: Decode keystore
        if: inputs.build_type != 'debug'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > android/app/soul-codex-release.keystore
          test -s android/app/soul-codex-release.keystore

      - name: Build Release APK
        if: inputs.build_type == 'release-apk'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=soul-codex-release.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }} \
            --stacktrace -i
          test -f app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/apk/release/app-release.apk >/dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/apk/release/APK-SHA256.txt

      - name: Build Release AAB (Play Store)
        if: inputs.build_type == 'release-aab'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PRELEASE_STORE_FILE=soul-codex-release.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }} \
            --stacktrace -i
          test -f app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee app/build/outputs/bundle/release/AAB-SIGNATURE.txt
          grep -q 'jar verified' app/build/outputs/bundle/release/AAB-SIGNATURE.txt
          sha256sum app/build/outputs/bundle/release/app-release.aab | tee app/build/outputs/bundle/release/AAB-SHA256.txt

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/soul-codex-release.keystore

      - name: Upload Debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            release-candidate-sha.txt
            release-version.txt
            api-contract.txt
          retention-days: 7

      - name: Upload Release APK
        if: inputs.build_type == 'release-apk'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/APK-SHA256.txt
            release-candidate-sha.txt
            release-version.txt
            api-contract.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        if: inputs.build_type == 'release-aab'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/AAB-SHA256.txt
            android/app/build/outputs/bundle/release/AAB-SIGNATURE.txt
            release-candidate-sha.txt
            release-version.txt
            api-contract.txt
          if-no-files-found: error
          retention-days: 30

      - name: Show build summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          echo "Build type: ${{ inputs.build_type }}"
          echo "Release version: $VITE_RELEASE_VERSION"
          echo "Release SHA: $VITE_RELEASE_SHA"
          echo "API contract: $VITE_API_CONTRACT"
