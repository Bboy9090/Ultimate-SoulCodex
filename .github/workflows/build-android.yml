name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-apk
          - release-aab

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://soulcodex.up.railway.app' }}
      VITE_RELEASE_VERSION: 4.0.0-rc.3
      VITE_RELEASE_SHA: ${{ github.sha }}
      VITE_API_CONTRACT: foundation-v4

    steps:
      - name: Checkout exact requested candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Record exact candidate SHA
        run: |
          echo "candidate_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$VITE_RELEASE_SHA"
          printf '%s\n' "$VITE_RELEASE_SHA" > release-candidate-sha.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages
        run: |
          npm run build -w @soulcodex/db
          npm run build -w @soulcodex/core

      - name: Validate mobile release configuration
        run: npm run mobile:validate:android

      - name: Build web app with release identity
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -i
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify signing secrets
        if: inputs.build_type != 'debug'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE" || { echo "MISSING: ANDROID_KEYSTORE"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "MISSING: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "MISSING: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "MISSING: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Decode and verify upload keystore
        if: inputs.build_type != 'debug'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > android/app/soul-codex-release.keystore
          test -s android/app/soul-codex-release.keystore
          keytool -list \
            -keystore android/app/soul-codex-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          chmod 600 android/app/soul-codex-release.keystore

      - name: Build Release APK
        if: inputs.build_type == 'release-apk'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=soul-codex-release.keystore \
            -PRELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
            --stacktrace -i
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/apk/release/APK-SHA256.txt

      - name: Build and verify Release AAB (Play Store)
        if: inputs.build_type == 'release-aab'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PRELEASE_STORE_FILE=soul-codex-release.keystore \
            -PRELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
            --stacktrace -i
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify \
            -keystore app/soul-codex-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            "$AAB" "$ANDROID_KEY_ALIAS" | tee app/build/outputs/bundle/release/JARSIGNER-VERIFY.txt
          grep -q "jar verified" app/build/outputs/bundle/release/JARSIGNER-VERIFY.txt
          sha256sum "$AAB" | tee app/build/outputs/bundle/release/AAB-SHA256.txt
          cp ../release-candidate-sha.txt app/build/outputs/bundle/release/RELEASE-CANDIDATE-SHA.txt

      - name: Upload Debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            release-candidate-sha.txt
          retention-days: 7

      - name: Upload Release APK
        if: inputs.build_type == 'release-apk'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/APK-SHA256.txt
            release-candidate-sha.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        if: inputs.build_type == 'release-aab'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/AAB-SHA256.txt
            android/app/build/outputs/bundle/release/JARSIGNER-VERIFY.txt
            android/app/build/outputs/bundle/release/RELEASE-CANDIDATE-SHA.txt
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing keystore
        if: always()
        run: rm -f android/app/soul-codex-release.keystore
