name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-apk
          - release-aab

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://soulcodex.up.railway.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build workspace packages
        run: |
          npm run build:workspaces

      - name: Validate mobile release configuration
        run: VITE_API_URL="${VITE_API_URL}" npm run mobile:validate:android

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -i 2>&1 | tee build.log

      - name: Verify Debug APK
        if: inputs.build_type == 'debug'
        run: |
          apk_file=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          if [ -z "$apk_file" ]; then
            echo "❌ Debug APK not found!"
            ls -la android/app/build/outputs/
            exit 1
          fi
          echo "✅ Debug APK created: $apk_file"
          echo "📦 APK Size: $(du -h "$apk_file" | cut -f1)"

      - name: Decode keystore
        if: inputs.build_type != 'debug'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Verifying keystore secrets..."
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "❌ Error: ANDROID_KEYSTORE secret is not set"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "❌ Error: ANDROID_KEYSTORE_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "❌ Error: ANDROID_KEY_ALIAS secret is not set"
            exit 1
          fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "❌ Error: ANDROID_KEY_PASSWORD secret is not set"
            exit 1
          fi

          echo "Decoding keystore from base64..."
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > android/app/soul-codex-release.keystore

          if [ ! -f "android/app/soul-codex-release.keystore" ]; then
            echo "❌ Keystore decode failed!"
            exit 1
          fi
          echo "✅ Keystore decoded successfully"

      - name: Build Release APK
        if: inputs.build_type == 'release-apk'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=soul-codex-release.keystore \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --stacktrace -i 2>&1 | tee build.log

      - name: Verify Release APK
        if: inputs.build_type == 'release-apk'
        run: |
          apk_file=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$apk_file" ]; then
            echo "❌ Release APK not found!"
            ls -la android/app/build/outputs/
            exit 1
          fi
          echo "✅ Release APK created: $apk_file"
          echo "📦 APK Size: $(du -h "$apk_file" | cut -f1)"

      - name: Build Release AAB (Play Store)
        if: inputs.build_type == 'release-aab'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PRELEASE_STORE_FILE=soul-codex-release.keystore \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --stacktrace -i 2>&1 | tee build.log

      - name: Verify Release AAB
        if: inputs.build_type == 'release-aab'
        run: |
          aab_file=$(find android/app/build/outputs/bundle/release -name "*.aab" -type f | head -1)
          if [ -z "$aab_file" ]; then
            echo "❌ Release AAB not found!"
            ls -la android/app/build/outputs/
            exit 1
          fi
          echo "✅ Release AAB created: $aab_file"
          echo "📦 AAB Size: $(du -h "$aab_file" | cut -f1)"

      - name: List build artifacts
        if: always()
        run: |
          echo "=== Build Output Directory ==="
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null || echo "No artifacts found"

      - name: Upload Debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/
          retention-days: 7

      - name: Upload Release APK
        if: inputs.build_type == 'release-apk'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/
          retention-days: 30

      - name: Upload Release AAB
        if: inputs.build_type == 'release-aab'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/soul-codex-release.keystore
          echo "✅ Keystore cleaned up"
