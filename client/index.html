<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0B0720" />
    <meta name="application-name" content="SoulCodex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SoulCodex" />
    <meta name="description" content="A local-first, evidence-linked Soul Codex reading experience." />
    <title>Ultimate SoulCodex</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
</head>
  <body>
    <div id="root">
      <div id="soulcodex-boot-shell" style="min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 22%,#32113f 0,#18091f 42%,#08060d 78%);color:#f5ead7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;padding:24px;box-sizing:border-box">
        <div>
          <div style="font-size:22px;font-weight:700;letter-spacing:.02em">Soul Codex</div>
          <div style="margin-top:10px;font-size:13px;opacity:.72">Opening your Codex…</div>
        </div>
      </div>
    </div>
    <script>
      window.__SOULCODEX_BOOT_READY__ = false;
      window.__SOULCODEX_SHOW_BOOT_FAILURE__ = function (reason) {
        if (window.__SOULCODEX_BOOT_READY__) return;
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#08060d;color:#f5ead7;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:28px;box-sizing:border-box;text-align:center"><div style="max-width:420px"><div style="font-size:24px;font-weight:700">Soul Codex needs to reload</div><div style="margin-top:12px;line-height:1.55;opacity:.76">The app shell opened, but the interface did not finish starting. Close and reopen Soul Codex. If this repeats, update to the newest build.</div><div style="margin-top:18px;font-size:11px;opacity:.46">Boot code: ' + String(reason || "startup-timeout").replace(/[<>&]/g,"") + '</div></div></div>';
      };
      window.addEventListener("error", function (event) {
        window.__SOULCODEX_SHOW_BOOT_FAILURE__("script-error");
      });
      window.addEventListener("unhandledrejection", function () {
        window.__SOULCODEX_SHOW_BOOT_FAILURE__("startup-rejection");
      });
      window.setTimeout(function () {
        window.__SOULCODEX_SHOW_BOOT_FAILURE__("startup-timeout");
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
