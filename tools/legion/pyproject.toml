[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legion-swarm"
version = "1.0.0"
description = "Flagship multi-agent swarm: Commander, worker fleet, Federation Committee, Judges and Master Tester"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BJ (bboy9090)" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
legion = "legion.cli:main"

[tool.setuptools]
packages = ["legion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
